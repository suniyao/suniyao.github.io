<?xml version="1.0" encoding="utf-8"?>
<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">
<!-- The ten square parts from robot.svg, reposed with the Task 3
     translate, rotate, and scale transforms. Polygon geometry is unchanged. -->
<svg version="1.1" id="Layer_1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" x="0px" y="0px"
	 width="500.0px" height="500.0px" viewBox="0 0 500 500" enable-background="new 0 0 500 500"
	 xml:space="preserve">

<g transform="translate(250 260)">
	<!-- torso -->
	<polygon fill="#EF161F" points="-50,-50 50,-50 -50,50 "/>
	<polygon fill="#EF161F" points="-50,50 50,-50 50,50"/>

	<!-- head -->
	<g transform="translate(0 -85)">
		<g transform="rotate(12)">
			<g transform="scale(.5 .5)">
				<polygon fill="#EF161F" points="-50,-50 50,-50 -50,50 "/>
				<polygon fill="#EF161F" points="-50,50 50,-50 50,50"/>
			</g>
		</g>
	</g>

	<!-- raised arm (viewer's right): shoulder -> upper arm -> elbow -> forearm -->
	<g transform="translate(50 -40)">
		<g transform="rotate(-30)">
			<g transform="translate(30 0)">
				<g transform="scale(.6 .2)">
					<polygon fill="#EF161F" points="-50,-50 50,-50 -50,50 "/>
					<polygon fill="#EF161F" points="-50,50 50,-50 50,50"/>
				</g>
			</g>
			<g transform="translate(60 0)">
				<g transform="rotate(-75)">
					<g transform="translate(30 0)">
						<g transform="scale(.6 .2)">
							<polygon fill="#EF161F" points="-50,-50 50,-50 -50,50 "/>
							<polygon fill="#EF161F" points="-50,50 50,-50 50,50"/>
						</g>
					</g>
				</g>
			</g>
		</g>
	</g>

	<!-- resting arm (viewer's left): hangs down, slight bend at the elbow -->
	<g transform="translate(-50 -40)">
		<g transform="rotate(110)">
			<g transform="translate(30 0)">
				<g transform="scale(.6 .2)">
					<polygon fill="#EF161F" points="-50,-50 50,-50 -50,50 "/>
					<polygon fill="#EF161F" points="-50,50 50,-50 50,50"/>
				</g>
			</g>
			<g transform="translate(60 0)">
				<g transform="rotate(-20)">
					<g transform="translate(30 0)">
						<g transform="scale(.6 .2)">
							<polygon fill="#EF161F" points="-50,-50 50,-50 -50,50 "/>
							<polygon fill="#EF161F" points="-50,50 50,-50 50,50"/>
						</g>
					</g>
				</g>
			</g>
		</g>
	</g>

	<!-- left leg: hip -> thigh -> knee -> shin -->
	<g transform="translate(-30 50)">
		<g transform="rotate(12)">
			<g transform="translate(0 30)">
				<g transform="scale(.2 .6)">
					<polygon fill="#EF161F" points="-50,-50 50,-50 -50,50 "/>
					<polygon fill="#EF161F" points="-50,50 50,-50 50,50"/>
				</g>
			</g>
			<g transform="translate(0 60)">
				<g transform="rotate(-8)">
					<g transform="translate(0 30)">
						<g transform="scale(.2 .6)">
							<polygon fill="#EF161F" points="-50,-50 50,-50 -50,50 "/>
							<polygon fill="#EF161F" points="-50,50 50,-50 50,50"/>
						</g>
					</g>
				</g>
			</g>
		</g>
	</g>

	<!-- right leg -->
	<g transform="translate(30 50)">
		<g transform="rotate(-12)">
			<g transform="translate(0 30)">
				<g transform="scale(.2 .6)">
					<polygon fill="#EF161F" points="-50,-50 50,-50 -50,50 "/>
					<polygon fill="#EF161F" points="-50,50 50,-50 50,50"/>
				</g>
			</g>
			<g transform="translate(0 60)">
				<g transform="rotate(8)">
					<g transform="translate(0 30)">
						<g transform="scale(.2 .6)">
							<polygon fill="#EF161F" points="-50,-50 50,-50 -50,50 "/>
							<polygon fill="#EF161F" points="-50,50 50,-50 50,50"/>
						</g>
					</g>
				</g>
			</g>
		</g>
	</g>
</g>

</svg>
